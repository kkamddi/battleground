name: BGI patch sync

on:
  schedule:
    # Wednesday and Thursday at 10:07 KST. GitHub may start scheduled jobs later.
    - cron: "7 1 * * 3,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bgi-patch-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect and publish official patch notes
        run: python scripts/patch_sync.py
      - name: Publish patch review digest
        run: python scripts/pending_patch_digest.py
