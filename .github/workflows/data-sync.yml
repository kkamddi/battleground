name: BGI data sync

on:
  schedule:
    # 10:17 KST, after the previous UTC day's PUBG sample is available.
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      max_matches:
        description: Maximum sampled matches to process
        required: false
        default: "500"
      top_player_matches:
        description: Competitive matches to inspect per leaderboard player
        required: false
        default: "10"
      sample_date:
        description: UTC telemetry date (YYYY-MM-DD); defaults to yesterday
        required: false

permissions:
  contents: read

concurrency:
  group: bgi-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
      MAX_MATCHES: ${{ inputs.max_matches || '500' }}
      TOP_PLAYER_MATCHES: ${{ inputs.top_player_matches || '10' }}
      SAMPLE_DATE: ${{ inputs.sample_date || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Seed the curated catalog
        run: python scripts/catalog_seed.py
      - name: Refresh official progressive-skin references
        run: python scripts/progressive_sync.py
      - name: Aggregate PUBG telemetry sample
        if: ${{ env.PUBG_API_KEY != '' }}
        run: python scripts/telemetry_sync.py
      - name: Sample official leaderboard player loadouts
        if: ${{ env.PUBG_API_KEY != '' }}
        run: python scripts/leaderboard_loadouts.py
      - name: Build weapon attachment recommendations
        if: ${{ env.PUBG_API_KEY != '' }}
        run: python scripts/loadout_rankings.py
      - name: Generate patch before and after comparisons
        if: ${{ env.PUBG_API_KEY != '' }}
        run: python scripts/meta_compare.py
